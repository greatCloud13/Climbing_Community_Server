server:
  port: 8080

spring:
  application:
    name: ClimbingWith

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:climbing_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379


vector:
  redis:
    host: localhost
    port: 6379

jwt:
  # 테스트 환경 전용 고정값 (환경변수 의존 없이 격리 실행)
  secret: your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  access-expiration: 1800000      # 30분
  refresh-expiration: 1209600000  # 14일

cors:
  allowed-origins: http://localhost:3000

file:
  upload-dir: /home/ubuntu/upload_files/