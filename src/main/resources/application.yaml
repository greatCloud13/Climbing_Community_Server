server:
  port: 8080

spring:
  application:
    name: ClimbingWith

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/climbingWith?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 'p@ssword'

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest


vector:
  redis:
    host: vector
    port: 6379

jwt:
  # 배포 환경에서는 JWT_SECRET 환경변수로 오버라이드됨 (docker-compose.prod.yml 참고). 아래 값은 로컬 개발용 기본값.
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 3600000  # 1시간

cors:
  # 콤마로 구분된 허용 출처 목록. 배포 환경에서는 CORS_ALLOWED_ORIGINS 환경변수로 오버라이드.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:60869}

file:
  upload-dir: /home/ubuntu/upload_files/